name: Daily matrix build

on:
  push:
    branches:
      - integrate/native-bindings-forks
      - fix/windows-startup-smoke-test
      - fix/windows-native-session-notifications
  schedule:
    # Daily at 02:17 UTC (10:17 Asia/Shanghai).
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_call:
