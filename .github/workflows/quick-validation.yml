name: Quick validation

on:
  push:
    branches:
      - integrate/native-bindings-forks
      - fix/windows-startup-smoke-test
      - fix/windows-native-session-notifications
      - feat/auto-detect-tun-network
  pull_request:
    branches:
      - integrate/native-bindings-forks
      - feat/auto-detect-tun-network
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-wfp-service-build:
    name: Windows WFP service and protocol tests
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure WFP service
        run: cmake -S Windows/Wfp/service -B build/wfp-service -A x64

      - name: Build WFP service and tests
        run: cmake --build build/wfp-service --config Release

      - name: Run WFP IPC protocol tests
        run: ctest --test-dir build/wfp-service -C Release --output-on-failure

  windows-wfp-driver-build:
    name: Windows x64 WFP kernel driver build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore pinned Windows SDK and WDK packages
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Build WFP callout driver for Windows 10 x64
        run: |
          msbuild Windows/Wfp/driver/FuriousWfpCallout.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:WindowsTargetPlatformVersion=10.0.26100.0

      - name: Verify driver binary was produced
        shell: pwsh
        run: |
          $driver = Get-ChildItem Windows/Wfp/driver -Filter FuriousWfpCallout.sys -Recurse | Select-Object -First 1
          if ($null -eq $driver) { throw "FuriousWfpCallout.sys was not produced." }
          Write-Host "Built driver: $($driver.FullName)"
          Get-FileHash $driver.FullName -Algorithm SHA256

      - name: Upload unsigned driver build
        uses: actions/upload-artifact@v7
        with:
          name: furious-wfp-driver-windows10-x64-unsigned
          path: Windows/Wfp/driver/**/FuriousWfpCallout.sys
          if-no-files-found: error
          retention-days: 7

  quick-checks:
    name: Python syntax and TUN runtime regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Compile Python sources
        run: |
          python -m compileall -q Deploy.py Furious tests
          echo "Python syntax validation passed"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install lightweight runtime-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            PySide6-Essentials PySide6-Addons \
            ujson pybase64 segno icmplib mss zxing-cpp pillow darkdetect

      - name: Run TUN UI, backend-selection, network, startup, and packaging tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest \
            tests.test_tun_settings_ui \
            tests.test_native_tun_semantics \
            tests.test_system_network_detection \
            tests.test_tun2socks_launch \
            tests.test_connection_startup_async \
            tests.test_runtime_lifecycle \
            tests.test_wintun_deployment \
            tests.test_xray_application_routing \
            -v
